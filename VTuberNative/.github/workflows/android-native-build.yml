name: Build Android APK (Native Cubism SDK)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  # Folder ini adalah root proyek Gradle sebenarnya (bawaan dari Cubism SDK Native).
  PROJECT_DIR: Samples/OpenGL/Demo/proj.android.cmake/Full

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install NDK & CMake yang dibutuhkan
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Cari file APK hasil build
        id: find_apk
        run: |
          APK_PATH=$(find "${{ env.PROJECT_DIR }}/app/build/outputs/apk" -name "*.apk" | head -n 1)
          echo "APK ditemukan di: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: icegirl-vtuber-native-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
