<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
</style>
<script>
  // Tangkap SEMUA error JS (termasuk error load script) dan kirim ke Android,
  // supaya kalau avatar gagal muncul, alasannya kelihatan di layar (bukan diam putih).
  window.onerror = function (message, source, lineno, colno, err) {
    try {
      if (window.Android && window.Android.onJsEvent) {
        window.Android.onJsEvent("onJsError", JSON.stringify({
          message: String(message), source: String(source), line: lineno
        }));
      }
    } catch (e) {}
    return false;
  };
  window.addEventListener("unhandledrejection", function (event) {
    try {
      if (window.Android && window.Android.onJsEvent) {
        window.Android.onJsEvent("onJsError", JSON.stringify({ message: String(event.reason) }));
      }
    } catch (e) {}
  });
  function reportScriptLoadError(name) {
    if (window.Android && window.Android.onJsEvent) {
      window.Android.onJsEvent("onJsError", JSON.stringify({ message: "Gagal memuat " + name + " (cek koneksi internet)" }));
    }
  }
</script>
<!-- Cubism 4 Core runtime (sudah dibundel, bukan dari CDN) -->
<script src="js/live2dcubismcore.min.js" onerror="reportScriptLoadError('live2dcubismcore.min.js')"></script>
<!-- PIXI v6 (wajib v6, pixi-live2d-display belum kompatibel penuh dengan v7+) -->
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/pixi.min.js" onerror="reportScriptLoadError('pixi.js (CDN)')"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js" onerror="reportScriptLoadError('pixi-live2d-display (CDN)')"></script>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="js/live2d-bridge.js"></script>
</body>
</html>
