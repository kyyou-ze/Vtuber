<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  canvas { width:100%; height:100%; display:block; }
</style>
<script>
  // Tangkap SEMUA error JS (termasuk error load script) dan kirim ke Android,
  // supaya kalau avatar gagal muncul, alasannya kelihatan di layar (bukan diam putih).
  window.onerror = function (message, source, lineno, colno, err) {
    try {
      if (window.Android && window.Android.onJsEvent) {
        window.Android.onJsEvent("onJsError", JSON.stringify({
          message: String(message), source: String(source), line: lineno
        }));
      }
    } catch (e) {}
    return false;
  };
  window.addEventListener("unhandledrejection", function (event) {
    try {
      if (window.Android && window.Android.onJsEvent) {
        window.Android.onJsEvent("onJsError", JSON.stringify({ message: String(event.reason) }));
      }
    } catch (e) {}
  });
  function reportError(msg) {
    if (window.Android && window.Android.onJsEvent) {
      window.Android.onJsEvent("onJsError", JSON.stringify({ message: msg }));
    }
  }

  // ===== Loader dengan beberapa CDN cadangan =====
  // Kalau satu sumber gagal (network error / file kosong / path salah),
  // otomatis coba sumber berikutnya, sampai "checkFn" mengonfirmasi
  // library-nya benar-benar berhasil ter-load.
  function loadScriptTag(url) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = url;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("gagal load: " + url)); };
      document.head.appendChild(s);
    });
  }

  async function loadFirstWorking(candidates, checkFn, label) {
    for (var i = 0; i < candidates.length; i++) {
      try {
        await loadScriptTag(candidates[i]);
        if (checkFn()) return true;
      } catch (e) {
        // lanjut coba URL berikutnya
      }
    }
    reportError("Gagal memuat " + label + " dari semua sumber CDN. Cek koneksi internet HP kamu.");
    return false;
  }

  async function bootstrap() {
    var pixiOk = await loadFirstWorking(
      [
        "https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/browser/pixi.min.js",
        "https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/pixi.min.js",
        "https://unpkg.com/pixi.js@6.5.9/dist/browser/pixi.min.js",
        "https://unpkg.com/pixi.js@6.5.9/dist/pixi.min.js"
      ],
      function () { return typeof PIXI !== "undefined" && typeof PIXI.Application === "function"; },
      "pixi.js"
    );
    if (!pixiOk) return;

    var live2dOk = await loadFirstWorking(
      [
        "https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js",
        "https://unpkg.com/pixi-live2d-display@0.4.0/dist/cubism4.min.js"
      ],
      function () { return typeof PIXI.live2d !== "undefined" && typeof PIXI.live2d.Live2DModel !== "undefined"; },
      "pixi-live2d-display"
    );
    if (!live2dOk) return;

    await loadScriptTag("js/live2d-bridge.js");
  }

  window.addEventListener("DOMContentLoaded", bootstrap);
</script>
<!-- Cubism 4 Core runtime (sudah dibundel lokal, bukan dari CDN, jadi selalu ada) -->
<script src="js/live2dcubismcore.min.js" onerror="reportError('Gagal memuat live2dcubismcore.min.js dari assets lokal')"></script>
</head>
<body>
<canvas id="canvas"></canvas>
</body>
</html>
