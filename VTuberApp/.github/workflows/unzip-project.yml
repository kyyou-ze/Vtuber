name: Unzip Project

# Cara pakai:
# 1. Upload/commit file "VTuberApp.zip" ke root repo ini (lewat web GitHub:
#    tombol "Add file" > "Upload files", atau lewat git push biasa).
# 2. Workflow ini otomatis jalan, meng-ekstrak isi zip ke root repo,
#    menghapus file zip-nya, lalu commit hasil ekstrakannya balik ke repo.
# 3. Bisa juga dijalankan manual lewat tab Actions > "Unzip Project" > Run workflow.
#
# Ganti nilai ZIP_FILE di bawah kalau nama/lokasi file zip-mu beda.

on:
  push:
    paths:
      - "**/*.zip"
  workflow_dispatch:
    inputs:
      zip_file:
        description: "Path file zip yang mau diekstrak (relatif dari root repo)"
        required: false
        default: "VTuberApp.zip"

env:
  ZIP_FILE: ${{ github.event.inputs.zip_file || 'VTuberApp.zip' }}

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cek file zip ada
        run: |
          if [ ! -f "$ZIP_FILE" ]; then
            echo "File '$ZIP_FILE' tidak ditemukan di repo, lewati."
            exit 0
          fi
          echo "ZIP_EXISTS=true" >> "$GITHUB_ENV"

      - name: Ekstrak zip ke root repo
        if: env.ZIP_EXISTS == 'true'
        run: |
          unzip -o "$ZIP_FILE" -d .
          rm -f "$ZIP_FILE"

      - name: Commit hasil ekstrak
        if: env.ZIP_EXISTS == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-extract ${{ env.ZIP_FILE }}"
          file_pattern: "."
